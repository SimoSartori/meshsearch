name: Release

# Publishes to PyPI when a v* tag is pushed. Run it from the Actions tab
# (workflow_dispatch) to build and test the artefacts without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag must match the version in pyproject.toml
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Build
        run: pipx run build --sdist

      - name: Check the metadata PyPI will render
        run: pipx run twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist/*.tar.gz

  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pypa/cibuildwheel@v4.2.1
        with:
          output-dir: wheelhouse

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    name: publish to PyPI
    needs: [sdist, wheels]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # The trusted publisher on PyPI is configured against this environment name
    # and this workflow's filename. Changing either means changing it there.
    environment:
      name: pypi
      url: https://pypi.org/p/meshsearch

    permissions:
      id-token: write          # mints the OIDC token PyPI checks; no API token

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
