name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - name: Linux clang
            os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - name: macOS Apple clang
            os: macos-latest
            cc: clang
            cxx: clang++

    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Every translation unit is compiled without FP contraction or math errno
        run: |
          python3 - <<'PY'
          import json, sys
          entries = json.load(open("build/compile_commands.json"))
          bad = 0
          for flag in ("-ffp-contract=off", "-fno-math-errno"):
              missing = [e["file"] for e in entries
                         if flag not in e.get("command", " ".join(e.get("arguments", [])))]
              print(len(entries), "translation units;", len(missing), "without", flag)
              bad += len(missing)
          sys.exit(1 if bad or not entries else 0)
          PY

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/prefix"

      # find_package(meshsearch CONFIG) against the installed tree
      - name: Consume the installed package
        run: |
          cmake -S tests/cmake/install -B build-install-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build build-install-consumer
          ./build-install-consumer/consumer

      # add_subdirectory on the source tree: no tests, no example, no build type
      - name: Consume the source tree as a subproject
        run: |
          cmake -S tests/cmake/subproject -B build-subproject-consumer -DMESHSEARCH_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-subproject-consumer
          ./build-subproject-consumer/consumer

  python:
    name: python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        python: ["3.10", "3.12", "3.14t"]

    # The job above builds the static library and links it into executables.
    # This one links it into a shared object, which is a different link and the
    # one that release wheels and every Linux source install perform. On 3.14t
    # the module is free-threaded, and the GIL test must run, not be skipped.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # pyproject.toml sets MESHSEARCH_BUILD_PYTHON=ON for this build
      - name: Build and install the module
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install ".[test]"

      # Run from outside the source tree, so that the installed module is the
      # one imported.
      - name: Test
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/venv/bin/python" -m pytest
          "$GITHUB_WORKSPACE/tests/test_meshgrid.py"
          "$GITHUB_WORKSPACE/tests/test_readme.py"
          "$GITHUB_WORKSPACE/tests/test_determinism.py"
          -p no:cacheprovider -rs

      - name: The GIL stays off after import
        if: endsWith(matrix.python, 't')
        working-directory: ${{ runner.temp }}
        run: >-
          "$RUNNER_TEMP/venv/bin/python" -c
          "import sys, meshsearch; assert not sys._is_gil_enabled()"

      # The library is linked into the module with hidden visibility, so the
      # module's dynamic symbol table holds none of its C++ symbols.
      - name: The module exports no meshsearch symbol
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: |
          module=$("$RUNNER_TEMP/venv/bin/python" -c "import meshsearch; print(meshsearch.__file__)")
          if nm -D --defined-only "$module" | c++filt | grep "meshsearch::"; then
            exit 1
          fi

      # The C++ install rules are off under scikit-build-core.
      - name: The wheel installs no C++ library or header
        run: |
          if "$RUNNER_TEMP/venv/bin/python" -m pip show -f meshsearch | grep -E '\.(a|h)$'; then
            exit 1
          fi
