name: CI

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Every translation unit is compiled without FP contraction
        run: |
          python3 - <<'PY'
          import json, sys
          entries = json.load(open("build/compile_commands.json"))
          bad = [e["file"] for e in entries
                 if "-ffp-contract=off" not in e.get("command", " ".join(e.get("arguments", [])))]
          print(len(entries), "translation units;", len(bad), "without -ffp-contract=off")
          sys.exit(1 if bad or not entries else 0)
          PY

      - name: Install
        run: cmake --install build --prefix "$RUNNER_TEMP/prefix"

      # find_package(meshsearch CONFIG) against the installed tree
      - name: Consume the installed package
        run: |
          cmake -S tests/cmake/install -B build-install-consumer -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/prefix"
          cmake --build build-install-consumer
          ./build-install-consumer/consumer

      # add_subdirectory on the source tree: no tests, no example, no build type
      - name: Consume the source tree as a subproject
        run: |
          cmake -S tests/cmake/subproject -B build-subproject-consumer -DMESHSEARCH_SOURCE_DIR="$GITHUB_WORKSPACE"
          cmake --build build-subproject-consumer
          ./build-subproject-consumer/consumer

  python:
    name: python module on ubuntu-latest
    runs-on: ubuntu-latest

    # The job above builds the static library and links it into executables.
    # This one links it into a shared object, which is a different link and the
    # one that release wheels and every Linux source install perform.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install the module
        # pyproject.toml sets MESHSEARCH_BUILD_PYTHON=ON for this build
        run: pip install ".[test]"

      - name: Test
        run: pytest tests/test_meshgrid.py

      # The library is linked into the module with hidden visibility, so the
      # module's dynamic symbol table holds none of its C++ symbols.
      - name: The module exports no meshsearch symbol
        run: |
          module=$(python -c "import meshsearch; print(meshsearch.__file__)")
          if nm -D --defined-only "$module" | c++filt | grep "meshsearch::"; then
            exit 1
          fi

      # The C++ install rules are off under scikit-build-core.
      - name: The wheel installs no C++ library or header
        run: |
          if pip show -f meshsearch | grep -E '\.(a|h)$'; then
            exit 1
          fi
